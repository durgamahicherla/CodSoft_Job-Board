<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Detail – JobNest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary:#0a0a0a; --accent:#f0e614; --accent2:#14f0a0; --surface:#141414; --surface2:#1e1e1e; --text:#f5f5f5; --muted:#888; --border:#2a2a2a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--primary); color:var(--text); font-family:'DM Sans',sans-serif; }
    h1,h2,h3,h4,h5 { font-family:'Syne',sans-serif; }
    .navbar { background:rgba(10,10,10,0.95); border-bottom:1px solid var(--border); backdrop-filter:blur(10px); padding:1rem 0; position:sticky; top:0; z-index:999; }
    .navbar-brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.5rem; color:var(--text) !important; letter-spacing:-1px; }
    .navbar-brand span { color:var(--accent); }
    .nav-link { color:var(--muted) !important; font-weight:500; transition:color 0.2s; }
    .nav-link:hover { color:var(--accent) !important; }
    .btn-accent { background:var(--accent); color:#000; font-weight:700; border:none; padding:0.6rem 1.6rem; border-radius:4px; font-family:'Syne',sans-serif; transition:transform 0.2s, box-shadow 0.2s; }
    .btn-accent:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(240,230,20,0.3); color:#000; }
    .btn-outline-accent { border:1.5px solid var(--accent); color:var(--accent); background:transparent; padding:0.6rem 1.6rem; border-radius:4px; font-family:'Syne',sans-serif; font-weight:600; transition:all 0.2s; }
    .btn-outline-accent:hover { background:var(--accent); color:#000; }

    .detail-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:2rem; }
    .company-logo-lg { width:72px; height:72px; background:var(--surface2); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
    .job-badge { display:inline-block; padding:0.3rem 0.8rem; border-radius:4px; font-size:0.8rem; font-weight:600; margin-right:0.5rem; margin-bottom:0.5rem; }
    .badge-type { background:rgba(240,230,20,0.1); color:var(--accent); border:1px solid rgba(240,230,20,0.2); }
    .badge-loc { background:rgba(20,240,160,0.1); color:var(--accent2); border:1px solid rgba(20,240,160,0.2); }
    .badge-exp { background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--border); }
    .info-row { display:flex; align-items:center; gap:0.6rem; color:var(--muted); font-size:0.9rem; padding:0.6rem 0; border-bottom:1px solid var(--border); }
    .info-row:last-child { border-bottom:none; }
    .info-row i { color:var(--accent); width:20px; }
    .info-val { color:var(--text); font-weight:500; margin-left:auto; }
    .section-head { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; margin-bottom:1rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border); }
    .skill-tag { display:inline-block; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:0.3rem 0.8rem; border-radius:6px; font-size:0.82rem; margin-right:0.4rem; margin-bottom:0.4rem; }
    ul.req-list { list-style:none; padding:0; }
    ul.req-list li { padding:0.4rem 0; color:var(--muted); font-size:0.92rem; display:flex; align-items:flex-start; gap:0.6rem; }
    ul.req-list li::before { content:'→'; color:var(--accent); flex-shrink:0; }
    .sidebar-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.5rem; position:sticky; top:80px; }
    .salary-big { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; color:var(--accent); }
    footer { background:var(--primary); border-top:1px solid var(--border); padding:2rem 0; text-align:center; color:var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">Job<span>Nest</span></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link" href="listings.html">Find Jobs</a></li>
        <li class="nav-item"><a class="nav-link" href="employer.html">For Employers</a></li>
        <li class="nav-item ms-2"><a href="login.html" class="btn btn-outline-accent btn-sm">Login</a></li>
        <li class="nav-item"><a href="login.html" class="btn btn-accent btn-sm">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <a href="listings.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-flex;align-items:center;gap:0.4rem;margin-bottom:1.5rem;">
    <i class="bi bi-arrow-left"></i> Back to Listings
  </a>

  <div class="row g-4" id="jobDetail">
    <div class="col-12 text-center py-5" style="color:var(--muted);">Loading job details...</div>
  </div>
</div>

<footer>
  <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;margin-bottom:0.5rem;">Job<span style="color:var(--accent)">Nest</span></div>
  © 2024 JobNest. Built for CodSoft Internship.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const JOBS = [
  { id:1, title:"Frontend Developer", company:"Google", logo:"🏢", location:"Hyderabad", type:"Full-time", exp:"2-4 yrs", salary:"₹12–18 LPA", category:"Technology", posted:"2 days ago", desc:"Build amazing user interfaces using React and modern web technologies.", requirements:["2+ years of React.js experience","Strong CSS and responsive design skills","Experience with REST APIs","Git version control knowledge","Good communication skills"], skills:["React","JavaScript","HTML/CSS","Bootstrap","Git","REST APIs"], about:"Google LLC is an American multinational technology company focusing on online advertising, search engine technology, cloud computing, and computer software." },
  { id:2, title:"UI/UX Designer", company:"Microsoft", logo:"🖥️", location:"Remote", type:"Remote", exp:"1-3 yrs", salary:"₹8–14 LPA", category:"Design", posted:"1 day ago", desc:"Design intuitive and beautiful digital experiences for millions of users.", requirements:["Proficiency in Figma or Adobe XD","Strong portfolio of UI/UX work","Understanding of user research methods","Experience with design systems","Excellent visual design skills"], skills:["Figma","Adobe XD","Prototyping","User Research","Design Systems","Wireframing"], about:"Microsoft Corporation is an American multinational technology corporation producing software, consumer electronics, and related services." },
  { id:3, title:"Data Scientist", company:"Amazon", logo:"📦", location:"Bangalore", type:"Full-time", exp:"3-5 yrs", salary:"₹20–30 LPA", category:"Technology", posted:"3 days ago", desc:"Analyze large datasets and build ML models to drive business decisions.", requirements:["3+ years in data science or ML","Proficiency in Python and R","Experience with ML frameworks (TensorFlow, PyTorch)","Strong SQL skills","Statistics and mathematics background"], skills:["Python","Machine Learning","TensorFlow","SQL","Statistics","Pandas","NumPy"], about:"Amazon.com, Inc. is an American multinational technology company focusing on e-commerce, cloud computing, digital streaming, and artificial intelligence." },
  { id:4, title:"Product Manager", company:"Flipkart", logo:"🛒", location:"Bangalore", type:"Full-time", exp:"4-6 yrs", salary:"₹25–35 LPA", category:"Management", posted:"5 days ago", desc:"Own product roadmap and drive growth for one of India's top e-commerce platforms.", requirements:["4+ years in product management","Strong analytical and problem-solving skills","Experience with agile methodologies","Excellent stakeholder management","Data-driven decision making"], skills:["Product Strategy","Agile","Roadmapping","Data Analysis","Stakeholder Management"], about:"Flipkart is an Indian e-commerce company, headquartered in Bengaluru, India, and incorporated in Singapore as a private limited company." },
  { id:5, title:"Backend Engineer", company:"Zomato", logo:"🍔", location:"Hyderabad", type:"Full-time", exp:"2-4 yrs", salary:"₹14–22 LPA", category:"Technology", posted:"1 day ago", desc:"Build scalable APIs and microservices powering millions of food orders.", requirements:["2+ years backend development","Proficiency in Node.js or Python","Experience with databases (MySQL, MongoDB)","Understanding of microservices","Knowledge of cloud platforms (AWS/GCP)"], skills:["Node.js","Python","MongoDB","MySQL","AWS","Docker","Microservices"], about:"Zomato is an Indian multinational restaurant aggregator and food delivery company founded in 2008 by Deepinder Goyal and Pankaj Chaddah." },
  { id:6, title:"Marketing Manager", company:"Swiggy", logo:"🛵", location:"Mumbai", type:"Full-time", exp:"3-5 yrs", salary:"₹10–16 LPA", category:"Marketing", posted:"4 days ago", desc:"Lead digital marketing campaigns and drive user acquisition growth.", requirements:["3+ years digital marketing experience","Expertise in Google Ads and Meta Ads","Strong analytical skills","Experience with CRM tools","Content strategy knowledge"], skills:["Digital Marketing","Google Ads","Meta Ads","SEO","Analytics","CRM"], about:"Swiggy is an Indian online food ordering and delivery platform, launched in July 2014 by Sriharsha Majety, Nandan Reddy and Rahul Jaimini." },
];

const urlParams = new URLSearchParams(window.location.search);
const jobId = parseInt(urlParams.get('id')) || 1;
const job = JOBS.find(j => j.id === jobId) || JOBS[0];

document.title = `${job.title} at ${job.company} – JobNest`;

document.getElementById('jobDetail').innerHTML = `
  <div class="col-lg-8">
    <div class="detail-card mb-4">
      <div class="d-flex gap-3 align-items-start mb-3">
        <div class="company-logo-lg">${job.logo}</div>
        <div>
          <h1 style="font-size:1.6rem;letter-spacing:-0.5px;">${job.title}</h1>
          <div style="color:var(--muted);">${job.company} · ${job.location}</div>
        </div>
      </div>
      <div>
        <span class="job-badge badge-type">${job.type}</span>
        <span class="job-badge badge-loc"><i class="bi bi-geo-alt"></i> ${job.location}</span>
        <span class="job-badge badge-exp">${job.exp}</span>
        <span class="job-badge badge-exp">${job.category}</span>
        <span class="job-badge badge-exp">Posted ${job.posted}</span>
      </div>
    </div>

    <div class="detail-card mb-4">
      <div class="section-head">Job Description</div>
      <p style="color:var(--muted);line-height:1.8;">${job.desc} We are looking for a passionate and talented individual to join our growing team. You will work alongside senior engineers and contribute to products used by millions of people every day.</p>
    </div>

    <div class="detail-card mb-4">
      <div class="section-head">Requirements</div>
      <ul class="req-list">
        ${job.requirements.map(r => `<li>${r}</li>`).join('')}
      </ul>
    </div>

    <div class="detail-card mb-4">
      <div class="section-head">Skills Required</div>
      ${job.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
    </div>

    <div class="detail-card">
      <div class="section-head">About ${job.company}</div>
      <p style="color:var(--muted);line-height:1.8;">${job.about}</p>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="sidebar-card mb-4">
      <div style="color:var(--muted);font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.3rem;">Salary Package</div>
      <div class="salary-big">${job.salary}</div>
      <hr style="border-color:var(--border);margin:1.2rem 0;">
      <div class="info-row"><i class="bi bi-briefcase"></i> Job Type <span class="info-val">${job.type}</span></div>
      <div class="info-row"><i class="bi bi-geo-alt"></i> Location <span class="info-val">${job.location}</span></div>
      <div class="info-row"><i class="bi bi-clock"></i> Experience <span class="info-val">${job.exp}</span></div>
      <div class="info-row"><i class="bi bi-tag"></i> Category <span class="info-val">${job.category}</span></div>
      <div class="info-row"><i class="bi bi-calendar"></i> Posted <span class="info-val">${job.posted}</span></div>
      <hr style="border-color:var(--border);margin:1.2rem 0;">
      <a href="apply.html?id=${job.id}" class="btn btn-accent w-100 mb-2">Apply Now →</a>
      <button class="btn btn-outline-accent w-100" onclick="alert('Job saved!')"><i class="bi bi-bookmark"></i> Save Job</button>
    </div>

    <div class="sidebar-card">
      <div class="section-head">Similar Jobs</div>
      ${JOBS.filter(j => j.id !== job.id && j.category === job.category).slice(0,3).map(j => `
        <div onclick="window.location='job-detail.html?id=${j.id}'" style="cursor:pointer;padding:0.8rem 0;border-bottom:1px solid var(--border);">
          <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;">${j.title}</div>
          <div style="color:var(--muted);font-size:0.8rem;">${j.company} · ${j.location}</div>
          <div style="color:var(--accent);font-size:0.85rem;font-weight:700;">${j.salary}</div>
        </div>
      `).join('') || '<div style="color:var(--muted);font-size:0.9rem;">No similar jobs found.</div>'}
    </div>
  </div>
`;
</script>
</body>
</html>
